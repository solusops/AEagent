version: "3.8"

services:
  api:
    image: ${IMAGE_TAG:-aos-api-elixir:latest}
    environment:
      - ADMIN_USERS=${ADMIN_USERS:-'[]'}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DATABASE_URL_LEGACY=${DATABASE_URL_LEGACY:-}
      - ENCRYPTION_KEYS=${ENCRYPTION_KEYS:?ENCRYPTION_KEYS is required}
      - LEGACY_SODIUM_SECRET_KEY=${LEGACY_SODIUM_SECRET_KEY:-}
      - MIX_ENV=${MIX_ENV:-prod}
      - PORT=${PORT:-4000}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - AOS_API_KEY=${AOS_API_KEY:?AOS_API_KEY is required}
      - AGENT_API_KEY=${AGENT_API_KEY:?AGENT_API_KEY is required}
      - AGENT_BASE_URL=${AGENT_BASE_URL:?AGENT_BASE_URL is required}
      - AGENT_MODEL=${AGENT_MODEL:?AGENT_MODEL is required}
      - WEBHOOK_SHARED_SECRET=${WEBHOOK_SHARED_SECRET:?WEBHOOK_SHARED_SECRET is required}
      - SLACK_SHARED_SECRET=${SLACK_SHARED_SECRET:?SLACK_SHARED_SECRET is required}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:?SLACK_SIGNING_SECRET is required}
    ports:
      - ${PORT:-4000}:${PORT:-4000}
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
